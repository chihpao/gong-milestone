      <path d="M26 -218 C20 -244 34 -264 54 -264 C74 -264 82 -244 74 -218 Z" fill="#f5ede0" stroke="#c49a45" stroke-width="1.8"/>
      <path d="M-18 -36 C-55 -32 -90 -22 -125 -26" stroke="#f4ede1" stroke-width="2.5" fill="none"/>
