<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <!-- Continuous SMIL scene; timing and loop design: ../../docs/ANIMATION_STORYBOARD.md. -->
  <defs>
    <radialGradient id="clown-studio-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#f5be47" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#e86146" stop-opacity="0.16"/>
      <stop offset="85%" stop-color="#2a1f42" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="0"/>
    </radialGradient>
    <g id="spark-ring">
      <circle cx="0" cy="0" r="30" stroke="#f5be47" stroke-width="2.5" fill="none" opacity="0.6"/>
      <circle cx="0" cy="0" r="60" stroke="#e86146" stroke-width="1.8" fill="none" opacity="0.4"/>
      <circle cx="0" cy="0" r="100" stroke="#8faec7" stroke-width="1.2" fill="none" opacity="0.25"/>
    </g>
  </defs>
  <rect width="1440" height="800" fill="#0c0e18"/>
  <rect width="1440" height="800" fill="url(#clown-studio-glow)"/>
  <g id="dance-floor">
    <polygon points="0,520 1440,520 1440,800 0,800" fill="#141724"/>
    <line x1="0" y1="520" x2="1440" y2="520" stroke="#354461" stroke-width="2.5"/>
    <line x1="0" y1="600" x2="1440" y2="600" stroke="#253147" stroke-width="2"/>
    <line x1="0" y1="690" x2="1440" y2="690" stroke="#1d2638" stroke-width="2.5"/>
  </g>
  <line x1="720" y1="20" x2="720" y2="780" stroke="#5a7b9e" stroke-width="2.5" stroke-dasharray="16 10" opacity="0.5"/>
  <g id="acrobatic-clown-real">
    <ellipse cx="0" cy="45" rx="65" ry="16" fill="#06070c" opacity="0.8">
      <animate attributeName="rx" values="65;40;65;36;65" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;.35;.8;.3;.8" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    <animateTransform attributeName="transform" type="translate" values="-240 540; 1680 540" dur="6.5s" repeatCount="indefinite" calcMode="linear"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -90; 0 0; 0 -110; 0 0" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.4 1; 0.4 0 0.2 1; 0.2 0.8 0.4 1; 0.4 0 0.2 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="2.2s" repeatCount="indefinite"/>
        <path d="M-18 18 C-25 -25 -20 -70 0 -110 C20 -70 25 -25 18 18 Z" fill="#101524" stroke="#f5be47" stroke-width="2.5"/>
        <circle cx="0" cy="-135" r="22" fill="#101524" stroke="#f5be47" stroke-width="2.5"/>
        <circle cx="8" cy="-135" r="8.5" fill="#e85d56">
          <animate attributeName="r" values="7.5;11;7.5" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="8" cy="-135" r="25" fill="#e85d56" opacity="0.3">
          <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1s" repeatCount="indefinite"/>
        </circle>
        <line x1="-12" y1="18" x2="-45" y2="70" stroke="#f5be47" stroke-width="5" stroke-linecap="round"/>
        <line x1="12" y1="18" x2="45" y2="70" stroke="#f5be47" stroke-width="5" stroke-linecap="round"/>
        <line x1="-15" y1="-80" x2="-65" y2="-120" stroke="#68dfc5" stroke-width="4" stroke-linecap="round"/>
        <line x1="15" y1="-80" x2="65" y2="-120" stroke="#68dfc5" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <g id="acrobatic-clown-mirror" opacity="0.65">
    <animateTransform attributeName="transform" type="translate" values="1680 540; -240 540" dur="6.5s" repeatCount="indefinite" calcMode="linear"/>
    <ellipse cx="0" cy="45" rx="65" ry="16" fill="#06070c" opacity=".6">
      <animate attributeName="rx" values="65;40;65;36;65" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;.35;.8;.3;.8" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -90; 0 0; 0 -110; 0 0" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.4 1; 0.4 0 0.2 1; 0.2 0.8 0.4 1; 0.4 0 0.2 1"/>
      <g transform="scale(-1 1)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2.2s" repeatCount="indefinite"/>
          <path d="M-18 18 C-25 -25 -20 -70 0 -110 C20 -70 25 -25 18 18 Z" fill="#182236" stroke="#8faec7" stroke-width="2"/>
          <circle cx="0" cy="-135" r="22" fill="#182236" stroke="#8faec7" stroke-width="2"/>
          <circle cx="-8" cy="-135" r="8.5" fill="#e85d56"/>
          <line x1="-12" y1="18" x2="-45" y2="70" stroke="#8faec7" stroke-width="4" stroke-linecap="round"/>
          <line x1="12" y1="18" x2="45" y2="70" stroke="#8faec7" stroke-width="4" stroke-linecap="round"/>
          <line x1="-15" y1="-80" x2="-65" y2="-120" stroke="#8faec7" stroke-width="3" stroke-linecap="round"/>
          <line x1="15" y1="-80" x2="65" y2="-120" stroke="#8faec7" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(720, 420)">
    <use href="#spark-ring">
      <animateTransform attributeName="transform" type="scale" values="0.4; 2.5" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.4 1"/>
      <animate attributeName="opacity" values="0.9; 0" dur="3.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g opacity="0.85">
    <circle cx="500" cy="360" r="3" fill="#f5be47">
      <animate attributeName="cy" values="360;220" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="300" r="3.5" fill="#ffffff">
      <animate attributeName="cy" values="300;160" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="340" r="2.8" fill="#e86146">
      <animate attributeName="cy" values="340;200" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
