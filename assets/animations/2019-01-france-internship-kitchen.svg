    <rect x="250" y="120" width="70" height="38" rx="4" fill="#47372a" stroke="#6b533e" stroke-width="1.8"/>
    <rect x="580" y="115" width="80" height="43" rx="4" fill="#3e3025" stroke="#6b533e" stroke-width="1.8"/>
    <rect x="980" y="110" width="75" height="48" rx="4" fill="#47372a" stroke="#6b533e" stroke-width="1.8"/>
    <rect x="1240" y="125" width="65" height="33" rx="4" fill="#3e3025" stroke="#6b533e" stroke-width="1.8"/>
  </g>
  <g id="kitchen-counter">
