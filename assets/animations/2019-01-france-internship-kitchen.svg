<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <!-- Continuous SMIL scene; timing and loop design: ../../docs/ANIMATION_STORYBOARD.md. -->
  <defs>
    <radialGradient id="kitchen-hearth" cx="0.45" cy="0.5" r="0.65">
      <stop offset="0%" stop-color="#c49a45" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#7a5522" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#110e0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rush-steam-left" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#fdf8ed" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#e2d4b5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c9b895" stop-opacity="0"/>
    </linearGradient>
    <g id="hanging-utensils">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#3d2f25" stroke-width="3"/>
      <circle cx="0" cy="140" r="28" fill="#291f18" stroke="#b38842" stroke-width="2.5"/>
      <line x1="60" y1="0" x2="60" y2="150" stroke="#3d2f25" stroke-width="3"/>
      <path d="M45 150 C45 175 75 175 75 150 Z" fill="#241a13" stroke="#c49a45" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1440" height="800" fill="#110e0c"/>
  <rect width="1440" height="800" fill="url(#kitchen-hearth)"/>
  <g id="back-racks" opacity="0.42">
    <animateTransform attributeName="transform" type="translate" values="-80 0; 120 0; -80 0" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
