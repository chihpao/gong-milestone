<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <!-- Continuous SMIL scene; timing and loop design: docs/ANIMATION_STORYBOARD.md. -->
  <defs>
    <linearGradient id="pacific-coastal-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081417"/>
      <stop offset="45%" stop-color="#0f2529"/>
      <stop offset="100%" stop-color="#183b3f"/>
    </linearGradient>
    <g id="passing-pole">
      <line x1="0" y1="0" x2="0" y2="800" stroke="#050a0c" stroke-width="8"/>
      <line x1="-50" y1="180" x2="50" y2="180" stroke="#091418" stroke-width="4"/>
      <circle cx="-45" cy="175" r="5" fill="#4d8c79"/>
      <circle cx="45" cy="175" r="5" fill="#4d8c79"/>
      <line x1="-60" y1="240" x2="60" y2="240" stroke="#091418" stroke-width="4"/>
      <circle cx="-55" cy="235" r="5" fill="#4d8c79"/>
      <circle cx="55" cy="235" r="5" fill="#4d8c79"/>
    </g>
    <g id="breaking-wave">
      <path d="M0 0 C40 -20 80 -25 120 0 C160 -20 200 -25 240 0 C280 -20 320 -25 360 0 C400 -20 440 -25 480 0" stroke="#5c9a9e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M20 -15 C60 -35 100 -40 140 -15 C180 -35 220 -40 260 -15 C300 -35 340 -40 380 -15" stroke="#c8e4e6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
    </g>
    <pattern id="mountain-loop-0" patternUnits="userSpaceOnUse" width="800" height="800" y="0">
      <path d="M0 390 C133.333 360 266.667 420 400 390 C533.333 360 666.667 420 800 390 L800 800 L0 800 Z" fill="#09161a"/>
      <animateTransform attributeName="patternTransform" values="0 0; -800 0" dur="12s" repeatCount="indefinite" calcMode="linear" type="translate"/>
    </pattern>
    <pattern id="mountain-loop-1" patternUnits="userSpaceOnUse" width="800" height="800" y="0">
      <path d="M0 440 C133.333 410 266.667 470 400 440 C533.333 410 666.667 470 800 440 L800 800 L0 800 Z" fill="#0d2126"/>
      <animateTransform attributeName="patternTransform" values="0 0; -800 0" dur="10s" repeatCount="indefinite" calcMode="linear" type="translate"/>
    </pattern>
  </defs>
  <rect width="1440" height="800" fill="url(#pacific-coastal-sky)"/>
  <g id="distant-mountains">
    <g>
      <rect x="0" y="0" width="1440" height="800" fill="url(#mountain-loop-0)"/>
    </g>
    <g>
      <rect x="0" y="0" width="1440" height="800" fill="url(#mountain-loop-1)"/>
    </g>
  </g>
  <g id="ocean-highway" transform="translate(0, 480)">
    <rect x="0" y="0" width="1440" height="320" fill="#0e2327"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#3d6c73" stroke-width="2.5"/>
    <g transform="translate(0, 40)">
      <use href="#breaking-wave" x="0"/>
      <use href="#breaking-wave" x="480"/>
      <use href="#breaking-wave" x="960"/>
      <use href="#breaking-wave" x="1440"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -480 0" dur="5s" repeatCount="indefinite" calcMode="linear" additive="sum"/>
      <use href="#breaking-wave" x="1920"/>
    </g>
    <g transform="translate(-160, 95)">
      <use href="#breaking-wave" x="0"/>
      <use href="#breaking-wave" x="480"/>
      <use href="#breaking-wave" x="960"/>
      <use href="#breaking-wave" x="1440"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -480 0" dur="4s" repeatCount="indefinite" calcMode="linear" additive="sum"/>
      <use href="#breaking-wave" x="1920"/>
    </g>
    <g transform="translate(-80, 160)">
      <use href="#breaking-wave" x="0"/>
      <use href="#breaking-wave" x="480"/>
      <use href="#breaking-wave" x="960"/>
      <use href="#breaking-wave" x="1440"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -480 0" dur="3s" repeatCount="indefinite" calcMode="linear" additive="sum"/>
      <use href="#breaking-wave" x="1920"/>
    </g>
  </g>
  <g id="speed-poles">
    <g>
      <use href="#passing-pole"/>
      <animateTransform attributeName="transform" type="translate" values="1600 0; -200 0" dur="1.4s" repeatCount="indefinite" calcMode="linear" begin="0s"/>
    </g>
    <g>
      <use href="#passing-pole"/>
      <animateTransform attributeName="transform" type="translate" values="1600 0; -200 0" dur="1.4s" repeatCount="indefinite" calcMode="linear" begin="-0.7s"/>
    </g>
  </g>
  <g id="window-frame-carriage" transform="translate(0, 0)">
    <path d="M0 0 L1440 0 L1440 800 L0 800 Z               M240 60 L1200 60 L1200 640 L240 640 Z" fill="#070c0e" fill-rule="evenodd"/>
    <rect x="200" y="630" width="1040" height="30" rx="4" fill="#142125" stroke="#253a40" stroke-width="2"/>
    <g id="swaying-plant" transform="translate(360, 630)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;5;-4;0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
        <path d="M-28 0 L28 0 L22 42 L-22 42 Z" fill="#223631" stroke="#3b5e55" stroke-width="2"/>
        <path d="M0 0 Q-30 -30 -65 -45 C-85 -55 -75 -75 -48 -65 Q-15 -45 0 0" fill="#4d8c79" stroke="#254d41" stroke-width="1.8"/>
        <path d="M0 0 Q-5 -45 0 -85 C5 -105 32 -100 26 -75 Q15 -45 0 0" fill="#589e89" stroke="#254d41" stroke-width="1.8"/>
        <path d="M0 0 Q22 -25 58 -35 C78 -42 72 -65 48 -55 Q18 -35 0 0" fill="#3f7565" stroke="#254d41" stroke-width="1.8"/>
      </g>
    </g>
    <g id="passenger-gong" transform="translate(1020, 480)">
      <path d="M-30 150 C-45 60 -35 -20 0 -90 C35 -20 45 60 30 150 Z" fill="#080e10" stroke="#5c9a9e" stroke-width="2"/>
      <circle cx="2" cy="-115" r="22" fill="#080e10" stroke="#5c9a9e" stroke-width="2"/>
      <line x1="-15" y1="40" x2="-65" y2="150" stroke="#080e10" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
