      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0; 0 -15; 0 0" dur="1.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <ellipse cx="20" cy="80" rx="96" ry="24" fill="#090705" opacity="0.8"/>
      <path d="M-22 20 C-12 -45 8 -115 35 -175 C52 -115 36 -45 5 20 Z" fill="#0d0a08" stroke="#d4b26f" stroke-width="2.2"/>
