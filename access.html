<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf6">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <title>進入</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf6;
      --ink: #111311;
      --muted: #737873;
      --mint: #71dfc2;
      --mint-ink: #147966;
      --sans: "Noto Sans TC", system-ui, sans-serif;
      --latin: "Montserrat", var(--sans);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }

    form {
      width: min(100%, 340px);
      text-align: center;
    }

    input {
      width: 100%;
      height: 56px;
      padding: 0 18px;
      border: 1px solid rgba(17, 19, 17, .22);
      border-radius: 0;
      color: var(--ink);
      background: transparent;
      text-align: center;
      font: 500 1.4rem/1 var(--latin);
      letter-spacing: .45em;
      outline: 0;
    }

    input::placeholder {
      color: var(--muted);
      font: 400 .78rem/1 var(--sans);
      letter-spacing: .12em;
      opacity: .52;
    }

    input:focus {
      border-color: var(--mint-ink);
    }

    button {
      min-width: 112px;
      min-height: 48px;
      margin-top: 24px;
      padding: 0 24px;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--paper);
      background: var(--ink);
      cursor: pointer;
      font: 400 .82rem/1 var(--sans);
      letter-spacing: .16em;
      transition: color .25s ease, background-color .25s ease;
    }

    button:is(:hover, :focus-visible) {
      color: var(--ink);
      background: var(--mint);
    }

    :focus-visible {
      outline: 2px solid var(--mint-ink);
      outline-offset: 5px;
    }

    p {
      min-height: 1.8em;
      margin: 12px 0 0;
      color: var(--mint-ink);
      font-size: .78rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <form novalidate>
    <input id="password" name="password" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
      autocomplete="off" placeholder="四位數密碼" aria-label="四位數密碼" aria-describedby="error">
    <button type="submit">進入</button>
    <p id="error" role="status" aria-live="polite"></p>
  </form>

  <script>
    const form = document.querySelector('form');
    const input = document.querySelector('input');
    const error = document.querySelector('#error');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (input.value === '0916') {
        location.replace('index.html');
        return;
      }
      error.textContent = '密碼不正確';
      input.select();
    });

    input.focus();
  </script>
</body>
</html>
