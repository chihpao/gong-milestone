<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <!-- Continuous SMIL scene; timing and loop design: ../../docs/ANIMATION_STORYBOARD.md. -->
  <defs>
    <radialGradient id="running-dawn-glow" cx="0.5" cy="0.65" r="0.65">
      <stop offset="0%" stop-color="#f5c26b" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#5ec9b5" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#16253d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <g id="road-mile-marker">
      <rect x="-18" y="-35" width="36" height="50" rx="8" fill="#f4ede1" stroke="#0e1724" stroke-width="2.5"/>
      <circle cx="0" cy="-18" r="5" fill="#f25f5c"/>
      <line x1="-10" y1="-2" x2="10" y2="-2" stroke="#0e1724" stroke-width="2.5"/>
      <line x1="-10" y1="6" x2="10" y2="6" stroke="#0e1724" stroke-width="2.5"/>
    </g>
    <g id="road-pole">
      <line x1="0" y1="0" x2="0" y2="350" stroke="#0a101a" stroke-width="7"/>
      <line x1="-40" y1="40" x2="40" y2="40" stroke="#0f1926" stroke-width="4"/>
      <circle cx="-35" cy="35" r="4" fill="#68e0c8"/>
      <circle cx="35" cy="35" r="4" fill="#68e0c8"/>
    </g>
    <pattern id="star-loop" patternUnits="userSpaceOnUse" width="720" height="800" y="0">
      <circle cx="280.0" cy="140" r="2.2" fill="#ffffff"/>
      <circle cx="560.0" cy="90" r="2.8" fill="#fdf2d0"/>
      <circle cx="170.0" cy="150" r="2" fill="#ffffff"/>
      <circle cx="500.0" cy="110" r="2.5" fill="#eef6fc"/>
      <circle cx="10.0" cy="160" r="2" fill="#ffffff"/>
      <path d="M60 140 L280 90 L520 150 L680 110" stroke="#487899" stroke-width="1.2" stroke-dasharray="6 6" fill="none" opacity=".4"/>
      <animateTransform attributeName="patternTransform" values="0 0; -720 0" dur="12s" repeatCount="indefinite" calcMode="linear" type="translate"/>
    </pattern>
    <pattern id="hill-loop-0" patternUnits="userSpaceOnUse" width="800" height="800" y="0">
      <path d="M0 520 C133.333 490 266.667 550 400 520 C533.333 490 666.667 550 800 520 L800 800 L0 800 Z" fill="#0d1829"/>
      <animateTransform attributeName="patternTransform" values="0 0; -800 0" dur="10s" repeatCount="indefinite" calcMode="linear" type="translate"/>
    </pattern>
    <pattern id="hill-loop-1" patternUnits="userSpaceOnUse" width="800" height="800" y="0">
      <path d="M0 560 C133.333 530 266.667 590 400 560 C533.333 530 666.667 590 800 560 L800 800 L0 800 Z" fill="#13233b"/>
      <animateTransform attributeName="patternTransform" values="0 0; -800 0" dur="8s" repeatCount="indefinite" calcMode="linear" type="translate"/>
    </pattern>
  </defs>
  <rect width="1440" height="800" fill="#070b12"/>
  <rect width="1440" height="800" fill="url(#running-dawn-glow)"/>
  <g opacity="0.75">
    <rect x="0" y="0" width="1440" height="800" fill="url(#star-loop)"/>
  </g>
  <g id="distant-hills">
    <g>
      <rect x="0" y="0" width="1440" height="800" fill="url(#hill-loop-0)"/>
    </g>
    <g>
      <rect x="0" y="0" width="1440" height="800" fill="url(#hill-loop-1)"/>
    </g>
  </g>
  <g id="highway-ground">
    <polygon points="0,620 1440,620 1440,800 0,800" fill="#182a45"/>
    <line x1="0" y1="620" x2="1440" y2="620" stroke="#335687" stroke-width="3"/>
    <line x1="0" y1="630" x2="1440" y2="630" stroke="#223b5e" stroke-width="2"/>
    <g transform="translate(0, 710)">
      <line x1="0" y1="0" x2="1600" y2="0" stroke="#68e0c8" stroke-width="5" stroke-dasharray="80 90">
        <animate attributeName="stroke-dashoffset" values="0; 170" dur="0.8s" repeatCount="indefinite" calcMode="linear"/>
      </line>
    </g>
  </g>
  <g id="speed-roadside">
    <g>
      <use href="#road-pole" x="0" y="380"/>
      <animateTransform attributeName="transform" type="translate" values="1600 0; -200 0" dur="2.2s" repeatCount="indefinite" calcMode="linear"/>
    </g>
    <g>
      <use href="#road-mile-marker" x="0" y="660"/>
      <animateTransform attributeName="transform" type="translate" values="1700 0; -150 0" dur="2.2s" begin="-1.1s" repeatCount="indefinite" calcMode="linear"/>
    </g>
  </g>
  <g id="shitty-proud-walker">
    <animateTransform attributeName="transform" type="translate" values="-240 540; 1680 540" dur="7s" repeatCount="indefinite" calcMode="linear"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0; 0 -15; 0 0" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <ellipse cx="0" cy="50" rx="55" ry="14" fill="#080e17" opacity="0.85"/>
      <path d="M-12 10 C-18 -25 -14 -70 4 -115 C18 -70 18 -25 12 10 Z" fill="#0a121c" stroke="#68e0c8" stroke-width="2.5"/>
      <circle cx="8" cy="-135" r="18" fill="#0a121c" stroke="#68e0c8" stroke-width="2.5"/>
      <path d="M-8 10 L-35 45 L-12 65" stroke="#68e0c8" stroke-width="4.5" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M-8 10 L-35 45 L-12 65;M-8 10 L-35 45 L-12 65;M-8 10 L30 40 L50 62;M-8 10 L18 38 L25 48;M-8 10 L-35 45 L-12 65" dur="0.7s" repeatCount="indefinite" keyTimes="0;.18;.5;.75;1" calcMode="spline" keySplines="0 0 1 1;.4 0 .6 1;0 0 .3 1;.5 0 1 1"/>
      </path>
      <path d="M8 10 L30 40 L50 62" stroke="#48b8a0" stroke-width="4.5" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M8 10 L30 40 L50 62;M8 10 L30 40 L50 62;M8 10 L-35 45 L-12 65;M8 10 L-18 38 L-25 48;M8 10 L30 40 L50 62" dur="0.7s" repeatCount="indefinite" keyTimes="0;.18;.5;.75;1" calcMode="spline" keySplines="0 0 1 1;.4 0 .6 1;0 0 .3 1;.5 0 1 1"/>
      </path>
      <path d="M-6 -80 L-35 -50 L-45 -20" stroke="#68e0c8" stroke-width="3" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M-6 -80 L-35 -50 L-45 -20; M-6 -80 L35 -50 L45 -20; M-6 -80 L-35 -50 L-45 -20" dur="0.7s" repeatCount="indefinite"/>
      </path>
      <path d="M6 -80 L35 -50 L45 -20" stroke="#48b8a0" stroke-width="3" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M6 -80 L35 -50 L45 -20; M6 -80 L-35 -50 L-45 -20; M6 -80 L35 -50 L45 -20" dur="0.7s" repeatCount="indefinite"/>
      </path>
      <polygon points="45,-120 48,-110 58,-107 48,-104 45,-94 42,-104 32,-107 42,-110" fill="#ffd766">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
  <g opacity="0.85">
    <circle cx="600" cy="540" r="3" fill="#f5c26b">
      <animateTransform attributeName="transform" type="translate" values="200 0; -1200 -80" dur="2s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite" keyTimes="0;.08;.92;1"/>
    </circle>
    <circle cx="950" cy="480" r="3.5" fill="#68e0c8">
      <animateTransform attributeName="transform" type="translate" values="200 0; -1300 -110" dur="1.7s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.7s" repeatCount="indefinite" keyTimes="0;.08;.92;1"/>
    </circle>
  </g>
</svg>
