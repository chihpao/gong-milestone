<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Paris Street Night Wet Atmosphere -->
    <linearGradient id="paris-street-wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090f18"/>
      <stop offset="55%" stop-color="#111c2a"/>
      <stop offset="100%" stop-color="#162538"/>
    </linearGradient>

    <!-- Translucent floating soap bubble -->
    <g id="drifting-bubble">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#68dfc5" stroke-width="2" opacity="0.75"/>
      <ellipse cx="-7" cy="-9" rx="7" ry="3.5" fill="#ffffff" opacity="0.8" transform="rotate(-30 -7 -9)"/>
      <circle cx="9" cy="9" r="2.5" fill="#ffffff" opacity="0.55"/>
    </g>

    <!-- A single industrial washing machine drum unit in perspective -->
    <g id="laundromat-drum-unit">
      <rect x="-110" y="-120" width="220" height="240" rx="16" fill="#13202e" stroke="#2c4258" stroke-width="2.5"/>
      <!-- Drum window -->
      <circle cx="0" cy="15" r="85" fill="#0d1620" stroke="#3d5875" stroke-width="6"/>
      <circle cx="0" cy="15" r="75" fill="#16293d"/>
      <!-- Fast spinning colorful laundry inside (1.2s rotation) -->
      <g transform="translate(0, 15)">
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="1.2s" repeatCount="indefinite"/>
        <path d="M-35 -25 C-15 -55 25 -50 45 -20 C60 10 20 45 -20 30 Z" fill="#cf9642"/>
        <path d="M-20 25 C-45 50 -10 65 20 50 C45 35 30 5 5 -15 Z" fill="#9c3b39"/>
        <path d="M15 -35 C45 -30 55 -5 30 20 C5 40 -25 15 -15 -15 Z" fill="#4ea69c"/>
      </g>
      <!-- Glass reflection glint -->
      <path d="M-60 -25 C-20 -65 25 -65 65 -25" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.25"/>
    </g>
  </defs>

  <!-- Paris Winter Street Night Base -->
  <rect width="1440" height="800" fill="url(#paris-street-wet)"/>

  <!-- Background: Laundromat Glass Storefront with Multiple Spinning Drums Panning Right-to-Left (8s cycle) -->
  <g id="storefront-layer" transform="translate(0, 360)">
    <!-- Panning storefront windows and machines (Midground Parallax) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="300 0; -900 0" dur="8s" repeatCount="indefinite" calcMode="linear"/>

      <!-- Storefront large glass mullions -->
      <rect x="-200" y="-220" width="2200" height="340" fill="#0c1724" stroke="#1c3047" stroke-width="4"/>
      <!-- Glowing Warm Neon Sign: "LAVERIE AUTOMATIQUE" -->
      <text x="120" y="-170" font-family="'Montserrat', sans-serif" font-weight="700" font-size="28" fill="#69d9c2" letter-spacing="4" opacity="0.85">LAVERIE 24/24</text>
      <text x="750" y="-170" font-family="'Montserrat', sans-serif" font-weight="700" font-size="28" fill="#f5be47" letter-spacing="4" opacity="0.85">BONNE ANNÉE</text>
      <text x="1350" y="-170" font-family="'Montserrat', sans-serif" font-weight="700" font-size="28" fill="#69d9c2" letter-spacing="4" opacity="0.85">LAVERIE</text>

      <!-- Row of spinning washing machines inside the store -->
      <use href="#laundromat-drum-unit" x="80" y="-40"/>
      <use href="#laundromat-drum-unit" x="340" y="-40"/>
      <use href="#laundromat-drum-unit" x="600" y="-40"/>
      <use href="#laundromat-drum-unit" x="860" y="-40"/>
      <use href="#laundromat-drum-unit" x="1120" y="-40"/>
      <use href="#laundromat-drum-unit" x="1380" y="-40"/>
      <use href="#laundromat-drum-unit" x="1640" y="-40"/>
    </g>

    <!-- Wet Sidewalk Ground with Shimmering Neon Reflections -->
    <polygon points="0,120 1440,120 1440,440 0,440" fill="#091018"/>
    <line x1="0" y1="120" x2="1440" y2="120" stroke="#25384d" stroke-width="3"/>
    
    <!-- Neon reflection streaks across wet pavement -->
    <path d="M150 140 L350 140 M550 150 L850 150 M1050 140 L1300 140" stroke="#69d9c2" stroke-width="4" opacity="0.3"/>
    <path d="M220 170 L480 170 M750 180 L980 180" stroke="#f5be47" stroke-width="3" opacity="0.25"/>
  </g>

  <!-- TRAVELER WITH UMBRELLA WALKING DOWN PARIS STREET (Full-screen Left-to-Right Traversal: 9s cycle) -->
  <g id="walking-traveler">
    <!-- Whole character moves across the entire width from left to right -->
    <animateTransform attributeName="transform" type="translate"
      values="-260 520; 1680 520"
      dur="9s" repeatCount="indefinite" calcMode="linear"/>

    <!-- Walking cadence bob up & down (0.8s) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -10; 0 0; 0 -10; 0 0"
        dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>

      <!-- Wet reflection pool beneath walking feet -->
      <ellipse cx="0" cy="55" rx="55" ry="14" fill="#050a10" opacity="0.8"/>
      <ellipse cx="0" cy="55" rx="40" ry="8" fill="#69d9c2" opacity="0.18"/>

      <!-- Legs in stride -->
      <line x1="-10" y1="0" x2="-28" y2="50" stroke="#080e16" stroke-width="6" stroke-linecap="round">
        <animate attributeName="x2" values="-28; 26; -28" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="10" y1="0" x2="26" y2="50" stroke="#080e16" stroke-width="6" stroke-linecap="round">
        <animate attributeName="x2" values="26; -28; 26" dur="0.8s" repeatCount="indefinite"/>
      </line>

      <!-- Winter Coat Silhouette -->
      <path d="M-22 5 C-30 -35 -20 -100 0 -150 C20 -100 30 -35 22 5 Z" fill="#0a121c" stroke="#68dfc5" stroke-width="2"/>
      <circle cx="0" cy="-175" r="18" fill="#0a121c" stroke="#68dfc5" stroke-width="2"/>
      <!-- Flowing winter scarf in wind -->
      <path d="M-15 -145 C-50 -140 -85 -130 -115 -140" stroke="#cf9642" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Arm holding dark umbrella -->
      <line x1="12" y1="-120" x2="25" y2="-170" stroke="#0a121c" stroke-width="5" stroke-linecap="round"/>
      <line x1="25" y1="-170" x2="35" y2="-250" stroke="#3d5875" stroke-width="3"/>

      <!-- Large Dome Umbrella Silhouette Sheltering Traveler -->
      <path d="M-85 -230 C-85 -290 155 -290 155 -230 Z" fill="#091018" stroke="#68dfc5" stroke-width="2.5"/>
      <!-- Umbrella rib lines -->
      <path d="M35 -275 L35 -230 M-25 -265 L-25 -230 M95 -265 L95 -230" stroke="#1d3045" stroke-width="1.8"/>
    </g>
  </g>

  <!-- FOREGROUND: RAPIDLY STREAMING PARIS WINTER RAIN & SOAP BUBBLES DRIFTING PAST (1.2s rain / 4s bubbles) -->
  <!-- Diagonal Slanted Rain Streams (Fast cinematic wiper: 1.2s) -->
  <g id="foreground-rain" opacity="0.55">
    <g>
      <line x1="100" y1="-40" x2="20" y2="280" stroke="#79a2c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="380" y1="-40" x2="300" y2="280" stroke="#79a2c7" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="680" y1="-40" x2="600" y2="280" stroke="#79a2c7" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="980" y1="-40" x2="900" y2="280" stroke="#79a2c7" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="1280" y1="-40" x2="1200" y2="280" stroke="#79a2c7" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="100 -120; -60 380; -220 880" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
    </g>
  </g>

  <!-- Iridescent Soap Bubbles Drifting Across the Lens (4s cycle) -->
  <g id="foreground-bubbles" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="1400 480; 120 180; -200 40" dur="4.8s" repeatCount="indefinite" calcMode="linear"/>
      <use href="#drifting-bubble" transform="scale(1.2)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1200 560; 340 320; -100 120" dur="4.2s" repeatCount="indefinite" calcMode="linear"/>
      <use href="#drifting-bubble" transform="scale(0.85)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1500 380; 680 140; 0 0" dur="5.2s" repeatCount="indefinite" calcMode="linear"/>
      <use href="#drifting-bubble" transform="scale(1.4)"/>
    </g>
  </g>
</svg>
