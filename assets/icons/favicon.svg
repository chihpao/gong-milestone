<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 外層透明，中心白色圓形底 -->
  <circle cx="50" cy="50" r="47" fill="#ffffff" />

  <!-- 短尾矮袋鼠線條組 (線條寬度加粗確保小圖清晰) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 圓耳朵 -->
    <path d="M 28 32 C 22 24, 30 14, 38 22" fill="#ffffff" />
    <path d="M 72 32 C 78 24, 70 14, 62 22" fill="#ffffff" />
    
    <!-- 圓潤臉型 -->
    <path d="M 33 25 C 41 21, 59 21, 67 25 C 75 30, 78 44, 78 54 C 78 68, 66 79, 50 79 C 34 79, 22 68, 22 54 C 22 44, 25 30, 33 25 Z" fill="#ffffff" />
    
    <!-- 招牌微笑嘴巴 -->
    <path d="M 36 57 Q 50 74 64 57" />
    <path d="M 34 56 Q 37 54 39 57" />
    <path d="M 66 56 Q 63 54 61 57" />
    <line x1="50" y1="51" x2="50" y2="65" />
  </g>

  <!-- 眼睛與鼻子 (實心黑色) -->
  <g fill="#1a1a1a">
    <!-- 左眼與亮點 -->
    <circle cx="37" cy="44" r="4.5" />
    <circle cx="38.5" cy="42.5" r="1.5" fill="#ffffff" />
    
    <!-- 右眼與亮點 -->
    <circle cx="63" cy="44" r="4.5" />
    <circle cx="64.5" cy="42.5" r="1.5" fill="#ffffff" />
    
    <!-- 倒三角圓潤鼻子 -->
    <path d="M 44 48 C 44 46, 56 46, 56 48 C 56 52, 52 55, 50 55 C 48 55, 44 52, 44 48 Z" />
  </g>
</svg>