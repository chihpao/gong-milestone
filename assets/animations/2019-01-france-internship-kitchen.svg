        <ellipse cx="0" cy="0" rx="55" ry="11" fill="#38291d" stroke="#c49a45" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="47" ry="8" fill="#ffd175"/>
        <path d="M52 16 C65 16 65 34 50 34" stroke="#b38842" stroke-width="3" fill="none"/>
        <path d="M-45 -55 C-30 -30 -15 -10 -48 24" stroke="#0d0a08" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M-30 -50 C0 -25 25 0 50 24" stroke="#0d0a08" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M-10 -12 C-60 -55 -120 -35 -190 -95 C-260 -155 -340 -130 -460 -185 C-580 -240 -680 -210 -820 -280" stroke="url(#rush-steam-left)" stroke-width="46" stroke-linecap="round" fill="none">
          <animate attributeName="d" values="               M-10 -12 C-60 -55 -120 -35 -190 -95 C-260 -155 -340 -130 -460 -185 C-580 -240 -680 -210 -820 -280;               M-10 -12 C-80 -40 -110 -70 -210 -80 C-280 -140 -330 -175 -480 -170 C-600 -220 -670 -250 -820 -280;               M-10 -12 C-60 -55 -120 -35 -190 -95 C-260 -155 -340 -130 -460 -185 C-580 -240 -680 -210 -820 -280             " dur="1.9s" repeatCount="indefinite"/>
        </path>
        <path d="M15 -8 C-35 -60 -95 -45 -160 -105 C-230 -165 -310 -145 -410 -210 C-510 -270 -620 -245 -740 -315" stroke="url(#rush-steam-left)" stroke-width="32" stroke-linecap="round" fill="none" opacity="0.65">
          <animate attributeName="d" values="               M15 -8 C-35 -60 -95 -45 -160 -105 C-230 -165 -310 -145 -410 -210 C-510 -270 -620 -245 -740 -315;               M15 -8 C-50 -45 -85 -80 -180 -90 C-250 -150 -300 -195 -430 -195 C-530 -255 -600 -285 -740 -315;               M15 -8 C-35 -60 -95 -45 -160 -105 C-230 -165 -310 -145 -410 -210 C-510 -270 -620 -245 -740 -315             " dur="1.6s" repeatCount="indefinite"/>
        </path>
      </g>
